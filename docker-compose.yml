services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bagoo_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-bagoo}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    networks:
      - bagoo_network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: bagoo_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - bagoo_network
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: bagoo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bagoo}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - bagoo_pgdata:/var/lib/postgresql/data
    networks:
      - bagoo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-bagoo}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  bagoo_network:
    driver: bridge

volumes:
  bagoo_pgdata:
    driver: local
